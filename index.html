<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JACKAL Studios | RedM Development</title>

    <meta
        name="description"
        content="JACKAL Studios — RedM development, systems, resources, support, and community."
    >

    <style>

        /* =========================================================
           GLOBAL
           ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(150, 0, 0, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #050505,
                    #0b0b0b 50%,
                    #030303
                );

            overflow-x: hidden;
        }

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            z-index: -1;
        }

        .container {

            width: min(1100px, 92%);

            margin: auto;

        }

        .red {
            color: #b00000;
        }

        /* =========================================================
           PREMIUM ANIMATED JACKAL BACKGROUND
           ========================================================= */

        .jackal-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -2;
            background:
                radial-gradient(circle at 50% 45%, rgba(110,0,0,.16), transparent 42%),
                radial-gradient(circle at 15% 85%, rgba(80,0,0,.12), transparent 35%),
                #020202;
        }

        .jackal-bg::before {
            content: "";
            position: absolute;
            inset: -50%;
            background:
                linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
            background-size: 55px 55px;
            transform: perspective(700px) rotateX(58deg) translateY(8%);
            transform-origin: center bottom;
            animation: gridMove 18s linear infinite;
            opacity: .55;
        }

        .jackal-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,.72) 100%);
        }

        .red-orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(180,0,0,.24), rgba(120,0,0,.08) 38%, transparent 72%);
            filter: blur(12px);
            animation: orbFloat 12s ease-in-out infinite;
        }

        .orb-one { top: -130px; left: -100px; }
        .orb-two { right: -140px; top: 25%; animation-delay: -4s; animation-duration: 15s; }
        .orb-three { left: 28%; bottom: -220px; animation-delay: -8s; animation-duration: 17s; }

        .red-beam {
            position: absolute;
            width: 70%;
            height: 180px;
            left: -20%;
            top: 20%;
            background: linear-gradient(90deg, transparent, rgba(180,0,0,.11), transparent);
            filter: blur(28px);
            transform: rotate(-12deg);
            animation: beamMove 13s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255,70,70,.7);
            box-shadow: 0 0 12px rgba(255,0,0,.55);
            animation: particleRise linear infinite;
        }

        .p1 { left: 8%; bottom: -10px; animation-duration: 12s; animation-delay: -2s; }
        .p2 { left: 18%; bottom: -10px; animation-duration: 17s; animation-delay: -8s; }
        .p3 { left: 31%; bottom: -10px; animation-duration: 14s; animation-delay: -4s; }
        .p4 { left: 47%; bottom: -10px; animation-duration: 19s; animation-delay: -11s; }
        .p5 { left: 59%; bottom: -10px; animation-duration: 13s; animation-delay: -6s; }
        .p6 { left: 72%; bottom: -10px; animation-duration: 16s; animation-delay: -3s; }
        .p7 { left: 84%; bottom: -10px; animation-duration: 21s; animation-delay: -13s; }
        .p8 { left: 93%; bottom: -10px; animation-duration: 15s; animation-delay: -9s; }
        .p9 { left: 14%; bottom: -10px; width: 2px; height: 2px; animation-duration: 18s; animation-delay: -7s; }
        .p10 { left: 26%; bottom: -10px; width: 2px; height: 2px; animation-duration: 11s; animation-delay: -1s; }
        .p11 { left: 39%; bottom: -10px; width: 4px; height: 4px; animation-duration: 22s; animation-delay: -15s; }
        .p12 { left: 64%; bottom: -10px; width: 2px; height: 2px; animation-duration: 12s; animation-delay: -5s; }
        .p13 { left: 78%; bottom: -10px; width: 3px; height: 3px; animation-duration: 20s; animation-delay: -12s; }
        .p14 { left: 88%; bottom: -10px; width: 2px; height: 2px; animation-duration: 16s; animation-delay: -4s; }

        @keyframes gridMove {
            from { background-position: 0 0, 0 0; }
            to { background-position: 0 55px, 55px 0; }
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate3d(0,0,0) scale(1); opacity: .55; }
            50% { transform: translate3d(80px,45px,0) scale(1.18); opacity: .9; }
        }

        @keyframes beamMove {
            0%, 100% { transform: translateX(-20%) rotate(-12deg); opacity: .2; }
            50% { transform: translateX(125%) rotate(-12deg); opacity: .75; }
        }

        @keyframes particleRise {
            0% { transform: translate3d(0,20px,0) scale(.4); opacity: 0; }
            15% { opacity: .8; }
            70% { opacity: .45; }
            100% { transform: translate3d(30px,-105vh,0) scale(1); opacity: 0; }
        }

        .ambient-streak {
            position: absolute;
            width: 46vw;
            min-width: 320px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, rgba(255,65,65,.5), rgba(255,160,160,.12), transparent);
            filter: blur(.2px) drop-shadow(0 0 10px rgba(255,0,0,.25));
            opacity: .55;
            transform: rotate(-18deg) translateX(-130%);
            animation: streakRun 11s linear infinite;
        }

        .streak-one { top: 24%; left: -8%; animation-delay: -2s; }
        .streak-two { top: 58%; left: 18%; width: 34vw; animation-delay: -6s; animation-duration: 14s; }
        .streak-three { top: 79%; left: -12%; width: 52vw; animation-delay: -9s; animation-duration: 17s; opacity: .38; }

        @keyframes streakRun {
            0% { transform: rotate(-18deg) translateX(-130%); opacity: 0; }
            8% { opacity: .6; }
            50% { opacity: .55; }
            92% { opacity: .15; }
            100% { transform: rotate(-18deg) translateX(245%); opacity: 0; }
        }

        .ambient-pulse {
            position: absolute;
            width: 18vmin;
            height: 18vmin;
            border-radius: 50%;
            border: 1px solid rgba(255,60,60,.18);
            box-shadow: 0 0 35px rgba(180,0,0,.10), inset 0 0 35px rgba(180,0,0,.08);
            animation: pulseRing 5.5s ease-out infinite;
        }

        .pulse-one { top: 34%; left: 12%; animation-delay: -1s; }
        .pulse-two { top: 72%; right: 10%; animation-delay: -3.4s; animation-duration: 7s; }

        @keyframes pulseRing {
            0% { transform: scale(.45); opacity: 0; }
            18% { opacity: .5; }
            70% { opacity: .14; }
            100% { transform: scale(1.55); opacity: 0; }
        }

        .screen-sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(255,35,35,.05) 48%, transparent 54%);
            transform: translateY(-120%);
            animation: screenSweep 9s ease-in-out infinite;
            mix-blend-mode: screen;
            opacity: .45;
        }

        @keyframes screenSweep {
            0%, 55% { transform: translateY(-120%); opacity: 0; }
            62% { opacity: .45; }
            78% { transform: translateY(120%); opacity: .08; }
            100% { transform: translateY(120%); opacity: 0; }
        }

        .cursor-glow {
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            left: 0;
            top: 0;
            transform: translate3d(calc(var(--cursor-x, 50vw) - 160px), calc(var(--cursor-y, 50vh) - 160px), 0);
            background: radial-gradient(circle, rgba(185,0,0,.16), rgba(110,0,0,.07) 34%, transparent 72%);
            filter: blur(10px);
            opacity: .7;
            transition: transform .12s ease-out;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 2px;
            z-index: 1200;
            background: linear-gradient(90deg, #650000, #d00000, #ff5656);
            box-shadow: 0 0 12px rgba(255,0,0,.45);
            transition: width .08s linear;
            pointer-events: none;
        }

        section, .work-section {
            position: relative;
        }

        section::after, .work-section::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: min(760px, 70%);
            height: 1px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, rgba(176,0,0,.25), transparent);
            opacity: .55;
        }

        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(24px) scale(.985);
            transition: opacity .8s ease, transform .8s cubic-bezier(.22,.61,.36,1);
        }

        .reveal-on-scroll.in-view {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card, .work-card, .team-card, .ecosystem-card {
            position: relative;
            overflow: hidden;
        }

        .card::before, .work-card::before, .team-card::before, .ecosystem-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 70%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,80,80,.08), transparent);
            transform: skewX(-18deg);
            transition: left .8s ease;
            pointer-events: none;
        }

        .card:hover::before, .work-card:hover::before, .team-card:hover::before, .ecosystem-card:hover::before {
            left: 150%;
        }

        @media (prefers-reduced-motion: reduce) {

            .brand img {
                animation: none !important;
                translate: 0 0 !important;
                transform: none !important;
            }
            .jackal-bg *, .jackal-bg::before, .red-orb, .red-beam, .particle, .ambient-streak, .ambient-pulse, .screen-sweep { animation: none !important; }
            .reveal-on-scroll { opacity: 1 !important; transform: none !important; }
            .cursor-glow { display: none !important; }
        }


        /* =========================================================
           NAVIGATION
           ========================================================= */

        nav {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            padding: 20px 0;

            background: rgba(0, 0, 0, 0.65);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(255,255,255,0.06);

        }

        .nav-inner {

            display: flex;

            align-items: center;

            justify-content: space-between;

        }

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-weight: 800;

            letter-spacing: 2px;

            white-space: nowrap;

        }

        .brand img {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            object-fit: cover;

            border:
                2px solid rgba(255,0,0,0.18);

            box-shadow:
                0 0 0 1px rgba(255,0,0,0.05),
                0 0 18px rgba(176,0,0,0.28),
                0 0 40px rgba(176,0,0,0.10);

            translate: 0 0;

            animation:
                logoFloat 4s ease-in-out infinite;

            transition:
                box-shadow 0.3s ease,
                border-color 0.3s ease;

        }

        .brand img:hover {

            border-color: rgba(255,0,0,0.42);

            box-shadow:
                0 0 0 2px rgba(255,0,0,0.08),
                0 0 24px rgba(255,0,0,0.42),
                0 0 55px rgba(176,0,0,0.18);

        }

        .nav-links {

            display: flex;

            gap: 24px;

        }

        .nav-links a {

            color: #aaa;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 1px;

            transition: 0.2s;

        }

        .nav-links a:hover {

            color: #ffffff;

        }


        /* =========================================================
           HERO
           ========================================================= */

        .hero {

            min-height: 100vh;

            display: flex;

            align-items: center;

            text-align: center;

            padding-top: 110px;

            padding-bottom: 80px;

        }

        .hero-content {

            width: 100%;

        }

        .logo {

            width: 155px;
            height: 155px;

            object-fit: cover;

            border-radius: 50%;

            margin-bottom: 28px;

            border:
                2px solid rgba(255,255,255,0.15);

            box-shadow:
                0 0 30px rgba(150,0,0,0.30),
                0 0 80px rgba(150,0,0,0.10);

            animation:
                float 4s ease-in-out infinite;

        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }

        @keyframes logoFloat {

            0%, 100% {
                translate: 0 0;
            }

            50% {
                translate: 0 -7px;
            }

        }

        .eyebrow {

            color: #aaa;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 4px;

            margin-bottom: 18px;

        }

        h1 {

            font-size:
                clamp(48px, 9vw, 92px);

            letter-spacing: 7px;

            line-height: 1;

            font-weight: 900;

        }

        .tagline {

            margin: 24px auto;

            max-width: 650px;

            color: #aaa;

            font-size: 18px;

            line-height: 1.7;

        }


        /* =========================================================
           CINEMATIC HERO
           ========================================================= */

        .hero {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            --hero-mx: 0px;
            --hero-my: 0px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: -20%;
            pointer-events: none;
            z-index: -5;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,0,0,.16), transparent 22%),
                radial-gradient(circle at 18% 55%, rgba(150,0,0,.12), transparent 24%),
                radial-gradient(circle at 82% 30%, rgba(255,20,20,.10), transparent 22%);
            filter: blur(22px);
            animation: heroAtmosphere 10s ease-in-out infinite alternate;
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -12%;
            width: 130%;
            height: 34%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: -4;
            background: linear-gradient(180deg, transparent, rgba(176,0,0,.09), transparent);
            filter: blur(16px);
            animation: heroHorizon 7s ease-in-out infinite;
        }

        .hero-cinematic {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -3;
            overflow: hidden;
        }

        .hero-beam {
            position: absolute;
            top: -25%;
            width: 18%;
            height: 160%;
            opacity: .16;
            filter: blur(12px);
            background: linear-gradient(90deg, transparent, rgba(255,0,0,.38), transparent);
            transform-origin: 50% 20%;
            mix-blend-mode: screen;
        }

        .hero-beam.one {
            left: 8%;
            transform: rotate(14deg) translateX(var(--hero-mx));
            animation: beamSweepOne 9s ease-in-out infinite;
        }

        .hero-beam.two {
            right: 7%;
            width: 13%;
            opacity: .13;
            transform: rotate(-16deg) translateX(calc(var(--hero-mx) * -1));
            animation: beamSweepTwo 11s ease-in-out infinite;
        }

        .hero-fog {
            position: absolute;
            width: 65%;
            height: 24%;
            left: 50%;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(176,0,0,.15), transparent 68%);
            filter: blur(18px);
            opacity: .9;
        }

        .hero-fog.one {
            top: 17%;
            animation: fogDriftOne 8s ease-in-out infinite;
        }

        .hero-fog.two {
            top: 57%;
            width: 78%;
            opacity: .55;
            animation: fogDriftTwo 12s ease-in-out infinite;
        }

        .hero-ring {
            position: absolute;
            left: 50%;
            top: 25%;
            width: 280px;
            height: 280px;
            border: 1px solid rgba(255,0,0,.16);
            border-radius: 50%;
            transform: translate3d(calc(-50% + var(--hero-mx)), calc(-5% + var(--hero-my)), 0) scale(.95);
            box-shadow:
                0 0 40px rgba(176,0,0,.10),
                inset 0 0 35px rgba(176,0,0,.05);
            animation: ringPulse 5s ease-in-out infinite;
        }

        .hero-ring::before,
        .hero-ring::after {
            content: "";
            position: absolute;
            inset: 16px;
            border: 1px solid rgba(255,40,40,.10);
            border-radius: 50%;
        }

        .hero-ring::after {
            inset: 34px;
            border-color: rgba(255,40,40,.07);
        }

        .hero-energy {
            position: absolute;
            left: 50%;
            top: 37%;
            width: min(82vw, 900px);
            height: 1px;
            transform: translate3d(calc(-50% + var(--hero-mx)), var(--hero-my), 0);
            background: linear-gradient(90deg, transparent, rgba(255,0,0,.04), rgba(255,0,0,.55), rgba(255,0,0,.04), transparent);
            box-shadow: 0 0 18px rgba(176,0,0,.25);
            animation: energyPulse 4.5s ease-in-out infinite;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            transform: translate3d(calc(var(--hero-mx) * .12), calc(var(--hero-my) * .12), 0);
            transition: transform .2s ease-out;
        }

        .hero-logo-motion {
            position: relative;
            display: inline-block;
            transform: none;
            animation: jackalLogoFloat 3.2s ease-in-out infinite;
            will-change: transform;
        }

        .hero .logo {
            position: relative;
            display: block;
            animation: none;
            transform: none;
            translate: none;
            transition: box-shadow .3s ease;
            box-shadow:
                0 0 0 1px rgba(255,0,0,.06),
                0 0 32px rgba(176,0,0,.38),
                0 0 90px rgba(176,0,0,.16);
        }

        .hero .logo:hover {
            box-shadow:
                0 0 0 2px rgba(255,0,0,.08),
                0 0 40px rgba(255,0,0,.48),
                0 0 110px rgba(176,0,0,.22);
        }

        .hero h1 {
            text-shadow:
                0 0 14px rgba(255,255,255,.04),
                0 0 34px rgba(176,0,0,.10);
        }

        .hero h1 .red {
            background: linear-gradient(90deg, #7d0000, #ff2020, #8f0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleRedFlow 4s linear infinite;
        }

        .hero .eyebrow {
            position: relative;
        }

        .hero .eyebrow::before,
        .hero .eyebrow::after {
            content: "";
            display: inline-block;
            vertical-align: middle;
            width: 42px;
            height: 1px;
            margin: 0 14px;
            background: linear-gradient(90deg, transparent, rgba(176,0,0,.7));
            box-shadow: 0 0 10px rgba(176,0,0,.35);
        }

        .hero .eyebrow::after {
            background: linear-gradient(90deg, rgba(176,0,0,.7), transparent);
        }

        .hero-scroll-indicator {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            width: 26px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 20px;
            opacity: .7;
            z-index: 3;
        }

        .hero-scroll-indicator::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 50%;
            width: 4px;
            height: 8px;
            border-radius: 4px;
            background: #b00000;
            box-shadow: 0 0 10px rgba(176,0,0,.8);
            transform: translateX(-50%);
            animation: scrollDot 1.8s ease-in-out infinite;
        }

        @keyframes heroAtmosphere {
            0% { transform: scale(1) translate3d(-2%, -1%, 0); opacity: .75; }
            100% { transform: scale(1.08) translate3d(2%, 1%, 0); opacity: 1; }
        }

        @keyframes heroHorizon {
            0%,100% { opacity: .35; transform: translateX(-50%) translateY(0); }
            50% { opacity: .75; transform: translateX(-50%) translateY(-18px); }
        }

        @keyframes beamSweepOne {
            0%,100% { margin-left: -3%; opacity: .08; }
            50% { margin-left: 10%; opacity: .22; }
        }

        @keyframes beamSweepTwo {
            0%,100% { margin-right: -2%; opacity: .06; }
            50% { margin-right: 10%; opacity: .18; }
        }

        @keyframes fogDriftOne {
            0%,100% { transform: translateX(-50%) translate3d(-3%, 0, 0) scale(.95); }
            50% { transform: translateX(-50%) translate3d(4%, -10px, 0) scale(1.05); }
        }

        @keyframes fogDriftTwo {
            0%,100% { transform: translateX(-50%) translate3d(5%, 0, 0) scale(1); }
            50% { transform: translateX(-50%) translate3d(-5%, 8px, 0) scale(1.08); }
        }

        @keyframes ringPulse {
            0%,100% { opacity: .42; transform: translate3d(calc(-50% + var(--hero-mx)), calc(-5% + var(--hero-my)), 0) scale(.94); }
            50% { opacity: .78; transform: translate3d(calc(-50% + var(--hero-mx)), calc(-5% + var(--hero-my)), 0) scale(1.04); }
        }

        @keyframes energyPulse {
            0%,100% { opacity: .25; transform: translate3d(calc(-50% + var(--hero-mx)), var(--hero-my), 0) scaleX(.82); }
            50% { opacity: .9; transform: translate3d(calc(-50% + var(--hero-mx)), var(--hero-my), 0) scaleX(1); }
        }

        @keyframes titleRedFlow {
            to { background-position: 200% center; }
        }

        @keyframes scrollDot {
            0% { transform: translate(-50%, 0); opacity: .2; }
            45% { opacity: 1; }
            100% { transform: translate(-50%, 16px); opacity: 0; }
        }

        @media (max-width: 700px) {
            .hero-ring { width: 210px; height: 210px; top: 28%; }
            .hero-beam { opacity: .08; }
            .hero .eyebrow::before,
            .hero .eyebrow::after { width: 18px; margin: 0 7px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero::before,
            .hero::after,
            .hero-beam,
            .hero-fog,
            .hero-ring,
            .hero-energy,
            .hero h1 .red,
            .hero-scroll-indicator::before {
                animation: none !important;
            }
            .hero-content {
                transform: none !important;
            }
            /* Keep the JACKAL logos animated even when reduced-motion is enabled. */
            .hero-logo-motion {

        /* =========================================================
           PREMIUM BUTTONS
           ========================================================= */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;

            margin-top: 35px;

        }

        .button {

            position: relative;

            isolation: isolate;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 205px;

            min-height: 52px;

            padding: 15px 28px;

            overflow: hidden;

            border-radius: 10px;

            text-decoration: none;

            font-weight: 900;

            font-size: 13px;

            letter-spacing: 1.6px;

            color: #fff;

            cursor: pointer;
            will-change: transform, box-shadow;

            transform: translateY(0);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease;

        }

        /* animated shine */
        .button::before {

            content: "";

            position: absolute;

            top: -60%;
            left: -80%;

            width: 45%;
            height: 220%;

            z-index: -1;

            transform: rotate(22deg);

            background: rgba(255,255,255,0.18);

            filter: blur(2px);

            transition: left 0.65s ease;

        }

        .button:hover::before {
            left: 135%;
        }

        .button::after {

            content: "";

            position: absolute;

            inset: 1px;

            z-index: -1;

            border-radius: 9px;

            pointer-events: none;

        }

        .button-primary {

            background:
                linear-gradient(135deg, #650000, #b00000 52%, #720000);

            border: 1px solid rgba(255,70,70,0.65);

            box-shadow:
                0 8px 25px rgba(120,0,0,0.32),
                inset 0 1px 0 rgba(255,255,255,0.12);

        }

        .button-primary::after {

            background:
                linear-gradient(180deg, rgba(255,255,255,0.06), transparent 48%);

        }

        .button-primary:hover {

            transform: translateY(-4px) scale(1.025);

            background:
                linear-gradient(135deg, #850000, #d00000 52%, #900000);

            border-color: #ff3b3b;

            box-shadow:
                0 14px 40px rgba(190,0,0,0.42),
                0 0 25px rgba(190,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.18);

        }

        .button-secondary {

            background:
                linear-gradient(135deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));

            border: 1px solid rgba(255,255,255,0.16);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

        }

        .button-secondary::after {

            background:
                linear-gradient(180deg, rgba(255,255,255,0.045), transparent 50%);

        }

        .button-secondary:hover {

            transform: translateY(-4px) scale(1.025);

            background:
                linear-gradient(135deg, rgba(176,0,0,0.20), rgba(255,255,255,0.055));

            border-color: rgba(255,55,55,0.65);

            box-shadow:
                0 14px 40px rgba(0,0,0,0.38),
                0 0 24px rgba(176,0,0,0.16),
                inset 0 1px 0 rgba(255,255,255,0.12);

        }

            transform: translateY(-1px) scale(0.99);
